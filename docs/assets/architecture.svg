<title id="title">LADIO architecture: observe, compose, perform</title><style>text{font-family:-apple-system, BlinkMacSystemFont, SF Pro Display, SF Pro, Helvetica Neue, Arial, sans-serif;fill:#15171d}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted{fill:#717783}</style>
<rect width="1210" height="550" rx="28" fill="#f7f8fa"/><text x="65" y="69" font-size="16" letter-spacing="2" class="mono muted">FIGURE 01 / SYSTEM OVERVIEW</text><text x="65" y="134" font-size="43" font-weight="650">One musical plan. Three clear boundaries.</text><rect x="65" y="190" width="330" height="198" rx="20" fill="#fff" stroke="#dde1e8"/><text x="90" y="232" font-size="15" class="mono muted">01</text><text x="90" y="290" font-size="27" font-weight="650">OBSERVE</text><text x="90" y="334" font-size="17" class="muted">Rhythm · energy · harmony</text><rect x="440" y="190" width="330" height="198" rx="20" fill="#fff" stroke="#dde1e8"/><text x="465" y="232" font-size="15" class="mono muted">02</text><text x="465" y="290" font-size="27" font-weight="650">COMPOSE</text><text x="465" y="334" font-size="17" class="muted">Cues · roles · scene choice</text><rect x="815" y="190" width="330" height="198" rx="20" fill="#fff" stroke="#dde1e8"/><text x="840" y="232" font-size="15" class="mono muted">03</text><text x="840" y="290" font-size="27" font-weight="650">PERFORM</text><text x="840" y="334" font-size="17" class="muted">Shared clock · DSP · recovery</text><path d="M405 287h23m-6-6 6 6-6 6" fill="none" stroke="#6478ed" stroke-width="2"/><path d="M780 287h23m-6-6 6 6-6 6" fill="none" stroke="#6478ed" stroke-width="2"/><rect x="65" y="424" width="1080" height="71" rx="14" fill="#eaf0ff"/><text x="91" y="467" font-size="19" fill="#3043b8">Prepare off the audio thread → publish immutable scene → bounded PCM pull</text></svg>