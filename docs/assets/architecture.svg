<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title"><title id="title">Четыре последовательных этапа работы LADIO</title><style>text{font-family:-apple-system,BlinkMacSystemFont,SF Pro Display,SF Pro,Helvetica Neue,Arial,sans-serif;fill:#252721}.muted{fill:#71746b}</style><rect width="1200" height="620" fill="#f5f3eb"/><text x="56" y="70" font-size="38" font-weight="600" style="fill:#252721" >От аудио к музыкальному решению</text><path d="M56 130H1144" stroke="#d6d6ca"/><text x="56" y="173" font-size="25" font-weight="550" style="fill:#252721" >Аудио и ритм</text><text x="455" y="173" font-size="21" font-weight="400" style="fill:#71746b" >PCM → доли, такты, энергия, локальная гармония</text><path d="M56 230H1144" stroke="#d6d6ca"/><text x="56" y="273" font-size="25" font-weight="550" style="fill:#252721" >Материал и сцена</text><text x="455" y="273" font-size="21" font-weight="400" style="fill:#71746b" >Фразы, точки входа, полезные лупы, стоимость подготовки</text><path d="M56 330H1144" stroke="#d6d6ca"/><text x="56" y="373" font-size="25" font-weight="550" style="fill:#252721" >Общая временная карта</text><text x="455" y="373" font-size="21" font-weight="400" style="fill:#71746b" >Основные дорожки, отдельные клипы и огибающие</text><path d="M56 430H1144" stroke="#d6d6ca"/><text x="56" y="473" font-size="25" font-weight="550" style="fill:#252721" >Исполнение</text><text x="455" y="473" font-size="21" font-weight="400" style="fill:#71746b" >Подготовленные окна → фильтры, эхо, реверб → плеер</text><text x="56" y="570" font-size="22" font-weight="400" style="fill:#71746b" >Анализ и подготовка работают отдельно от аудиопотока.</text></svg>